{% set name = "mlva-seer" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/microbemarsh/mlva_seer/archive/refs/tags/v{{ version }}.tar.gz
  sha256: REPLACE_WITH_RELEASE_TARBALL_SHA256

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} setup.py install --single-version-externally-managed --record=record.txt
  entry_points:
    - mlva-seer = mlva_seer.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - amplirust
    - numpy >=1.24
    - parasail >=1.3.4
    - pysam >=0.22
    - minimap2
    - sassy-rs >=0.2.4

test:
  imports:
    - mlva_seer
  commands:
    - mlva-seer --help
    - mlva-seer call --help
    - mlva-seer simulate --help
    - mlva-seer extract-amplicons --help

about:
  home: https://github.com/microbemarsh/mlva_seer
  summary: MLVA/VNTR genotyping from sequencing reads and assemblies
  description: |
    MLVA Seer converts VNTR sequencing reads and assemblies into
    interpretable repeat-copy-number calls, sequence-aware VNTR repeat
    variants, probabilistic MLVA fingerprints, and known-profile matches.
    Assembly and reference in-silico PCR extraction is delegated to amplirust,
    which uses sassy for accelerated approximate primer matching.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - microbemarsh
