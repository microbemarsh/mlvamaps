{% set name = "mlvamaps" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/microbemarsh/mlvamaps/archive/refs/tags/v{{ version }}.tar.gz
  sha256: REPLACE_WITH_RELEASE_TARBALL_SHA256

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} setup.py install --single-version-externally-managed --record=record.txt
  entry_points:
    - mlvamaps = mlvamaps.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=68
  run:
    - python >=3.10
    - minimap2
    - skesa
    - mafft
    - raxml-ng
    - epa-ng
    - mummer4
    - numpy >=1.24
    - parasail-python >=1.3.4
    - pysam >=0.22
    - regex >=2024.5.15
    - sassy-rs >=0.2.6

test:
  imports:
    - mlvamaps
  commands:
    - mlvamaps --help
    - mlvamaps call --help
    - mlvamaps simulate --help
    - mlvamaps extract-amplicons --help

about:
  home: https://github.com/microbemarsh/mlvamaps
  summary: MLVA/VNTR genotyping from sequencing reads and assemblies
  description: |
    mlvamaps converts VNTR sequencing reads and assemblies into
    interpretable repeat-copy-number calls, sequence-aware VNTR repeat
    variants, probabilistic MLVA fingerprints, and known-profile matches.
    Illumina local assembly uses SKESA. Assembly and reference in-silico PCR
    extraction uses the sassy-rs Python binding with MLVA_finder-compatible
    pairing and selection semantics.
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - microbemarsh
