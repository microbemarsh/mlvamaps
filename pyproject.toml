[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlva-seer"
version = "0.1.0"
description = "Nanopore amplicon MLVA/VNTR genotyping prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "MLVA Seer contributors"}]
keywords = ["mlva", "vntr", "nanopore", "amplicon", "genotyping", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/microbemarsh/mlva_seer"
Repository = "https://github.com/microbemarsh/mlva_seer"
Issues = "https://github.com/microbemarsh/mlva_seer/issues"

[project.optional-dependencies]
bio = [
    "sassy-rs",
    "edlib>=1.3.9",
    "pysam>=0.22",
]
dev = [
    "pytest",
    "sassy-rs",
    "edlib>=1.3.9",
]

[project.scripts]
mlva-seer = "mlva_nanopore.cli:main"
mlva-nanopore = "mlva_nanopore.cli:main"

[tool.setuptools.packages.find]
include = ["mlva_nanopore*"]

[tool.pytest.ini_options]
pythonpath = ["."]
